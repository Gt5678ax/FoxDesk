changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security
      labels:
        - security
    - title: New and improved
      labels:
        - enhancement
    - title: Bug fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Maintenance
      labels:
        - "*"
  change-template: "- $TITLE by @$AUTHOR in #$NUMBER"
  template: |
    ## What changed

    $CHANGES

    ## Before updating

    Back up the database, configuration, and uploaded files. Follow the update and rollback instructions included with the release.

    **Full changelog:** $PREVIOUS_TAG...$RESOLVED_VERSION
