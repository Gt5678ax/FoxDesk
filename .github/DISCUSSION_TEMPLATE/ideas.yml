title: "[Idea] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the real workflow and who is affected.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a good result look like?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: How do you handle it today?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This idea is for the self-hosted edition.
          required: true
