title: "[Question] "
body:
  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FoxDesk version
      placeholder: v0.3.140
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: PHP, database, web server, and operating system where relevant.
  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, customer data, and personal information.
          required: true
